# yaml-language-server: $schema=https://aka.ms/azure-dev/azure.yaml.json
name: apiops-apim-mcp-container
requiredVersions:
  azd: '>=1.27.0'
infra:
  provider: bicep
  path: ../../infra
  module: container
services:
  backend:
    project: ../..
    language: docker
    host: appservice
    resourceName: ${AZURE_WEBAPP_NAME}
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      remoteBuild: false
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ../../scripts/ps1/Preprovision.ps1
    posix:
      shell: sh
      run: bash ../../scripts/bash/preprovision.sh
  postdeploy:
    windows:
      shell: pwsh
      run: ../../scripts/ps1/Verify-Source.ps1
    posix:
      shell: sh
      run: bash ../../scripts/bash/verify-source.sh
