# yaml-language-server: $schema=https://aka.ms/azure-dev/azure.yaml.json
name: apiops-apim-mcp-poc
infra:
  provider: bicep
  path: infra
services:
  backend:
    project: .
    language: js
    host: appservice
    resourceName: ${AZURE_WEBAPP_NAME}
    dist: .local/backend
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ./scripts/ps1/Package-Backend.ps1
        posix:
          shell: sh
          run: bash ./scripts/bash/package-backend.sh
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/ps1/Preprovision.ps1
    posix:
      shell: sh
      run: bash ./scripts/bash/preprovision.sh
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/ps1/Verify-Source.ps1
    posix:
      shell: sh
      run: bash ./scripts/bash/verify-source.sh
