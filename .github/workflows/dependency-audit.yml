name: Dependency risk audit

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-risk-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit dependency risks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Evaluate production and full-tree dependency risks
        id: audit
        run: npm run audit:dependencies
      - name: Report setup failure
        if: ${{ failure() && steps.audit.outcome == 'skipped' }}
        run: |
          printf '## Dependency-risk audit\n\n**ERROR:** Audit setup failed. Dependencies were not evaluated.\n' >> "$GITHUB_STEP_SUMMARY"
