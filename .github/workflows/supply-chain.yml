name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    paths: [package.json, package-lock.json, .github/workflows/supply-chain.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-sbom:
    name: Verify signatures and generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
