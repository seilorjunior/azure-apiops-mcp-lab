name: Bug report
description: Report a reproducible problem without sensitive configuration.
body:
  - type: markdown
    attributes:
      value: Do not include secrets, local environment files, APIM exports or unredacted logs. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include OS, Node/APIops versions, shell and sanitized failing stage.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error and validation performed
